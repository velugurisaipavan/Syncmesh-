[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncmesh-paper-starter"
version = "0.1.0"
description = "New paper-aligned Syncmesh distributed weather-query prototype"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pymongo>=4.8,<5", "graphql-core>=3.2,<3.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "mongomock>=4.1,<5"]

[tool.setuptools.packages.find]
include = ["syncmesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
